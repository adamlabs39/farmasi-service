stages:
  - build
  - deploy

build-image:
  stage: build
  before_script:
    - echo "@adameds:registry=https://gitlab.com/api/v4/groups/93029767/-/packages/npm/" >> .npmrc
    - echo "//gitlab.com/api/v4/groups/93029767/-/packages/npm/:_authToken=$AUTH_TOKEN" >> .npmrc
    - cat .npmrc
    - docker compose --env-file /home/admin/adameds/.env-farmasi down --rmi all
  only:
    - dev-deployment
  script:
    - docker build -t adameds/faramsi-service:dev ./ --no-cache

deploy-app:
  only:
    - dev-deployment
  stage: deploy
  script:
    - docker compose --env-file /home/admin/adameds/.env-farmasi up -d

