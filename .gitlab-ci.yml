stages:
  - build
  - deploy

build-image:
  stage: build
  before_script:
    - docker compose --env-file /home/admin/adameds/.env-farmasi down --rmi all
  script:
    - docker build -t adameds/faramsi-service:dev ./ --no-cache
  only:
    - dev-deployment

deploy-app:
  stage: deploy
  script:
    - docker compose --env-file /home/admin/adameds/.env-farmasi up -d
  only:
    - dev-deployment