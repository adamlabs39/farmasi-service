services:
  adameds-farmasi:
    build:
      context: ./
      dockerfile: Dockerfile
      no_cache: true
    image: adameds/faramsi-service:dev
    container_name: adameds-farmasi
    ports:
      - 8086:8086
    restart: always
    networks:
      - farmasi-network
    environment:
      DOTENV_KEY: ${DOTENV_KEY}
      API_BASE: ${API_BASE}
      API_VERSION: ${API_VERSION}
      BASE_URL: ${BASE_URL}
    volumes:
      - type: bind
        source: /home/admin/adameds/private.key
        target: /adameds-farmasi/private.key
      - type: bind
        source: /home/admin/adameds/public.key
        target: /adameds-farmasi/public.key
      - type: bind
        source: /home/admin/adameds/.env.vault
        target: /adameds-farmasi/.env.vault
networks:
    farmasi-network:
        driver: bridge